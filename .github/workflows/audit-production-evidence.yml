name: Moventra Production Evidence Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  production-evidence-audit:
    name: Correlate protected production evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Discover and validate authoritative production promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api() {
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          mkdir -p audit/evidence

          main_json="$(api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main")"
          main_sha="$(jq -r '.object.sha' <<< "$main_json")"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]

          runs_json="$(api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/production-promotion.yml/runs?branch=main&per_page=100")"
          mapfile -t candidate_run_ids < <(
            jq -r '.workflow_runs[]
              | select(.name == "Moventra Production Promotion")
              | select(.head_branch == "main")
              | select(.status == "completed")
              | select(.conclusion == "success")
              | .id' <<< "$runs_json"
          )

          test "${#candidate_run_ids[@]}" -gt 0 || {
            echo '::error::No successful Moventra Production Promotion run was found on main.'
            exit 1
          }

          selected_run_id=''
          selected_artifact_id=''
          selected_dir=''

          for run_id in "${candidate_run_ids[@]}"; do
            artifacts_json="$(api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
            expected_name="production-deployment-${main_sha}"
            artifact_id="$(jq -r --arg name "$expected_name" '
              [.artifacts[] | select(.name == $name and .expired == false)]
              | sort_by(.created_at)
              | last
              | .id // empty' <<< "$artifacts_json")"
            [[ "$artifact_id" =~ ^[0-9]+$ ]] || continue

            candidate_dir="audit/candidate-${run_id}"
            rm -rf "$candidate_dir"
            mkdir -p "$candidate_dir"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output "${candidate_dir}/artifact.zip"
            unzip -q "${candidate_dir}/artifact.zip" -d "${candidate_dir}/unzipped"

            mapfile -t production_files < <(find "${candidate_dir}/unzipped" -type f -name 'production-deployment.txt' -print)
            mapfile -t approval_files < <(find "${candidate_dir}/unzipped" -type f -name 'approval-history.json' -print)
            [[ "${#production_files[@]}" -eq 1 && "${#approval_files[@]}" -eq 1 ]] || continue

            evidence="${production_files[0]}"
            approval_history="${approval_files[0]}"
            commit_sha="$(awk -F= '$1=="commit_sha" {print $2}' "$evidence")"
            result="$(awk -F= '$1=="result" {print $2}' "$evidence")"
            approval_state="$(awk -F= '$1=="approval_state" {print $2}' "$evidence")"
            prevent_self_review="$(awk -F= '$1=="prevent_self_review" {print $2}' "$evidence")"
            workflow_run_id="$(awk -F= '$1=="workflow_run_id" {print $2}' "$evidence")"
            approver="$(awk -F= '$1=="approver" {print $2}' "$evidence")"

            [[ "$commit_sha" == "$main_sha" ]] || continue
            [[ "$result" == success ]] || continue
            [[ "$approval_state" == approved ]] || continue
            [[ "$prevent_self_review" == true ]] || continue
            [[ "$workflow_run_id" == "$run_id" ]] || continue
            [[ -n "$approver" ]] || continue

            jq -e --arg approver "$approver" '
              [.[]
                | select(.state == "approved")
                | select(.user.login == $approver)
                | select(any(.environments[]?; .name == "production"))]
              | length >= 1' "$approval_history" >/dev/null || continue

            selected_run_id="$run_id"
            selected_artifact_id="$artifact_id"
            selected_dir="$candidate_dir"
            break
          done

          [[ "$selected_run_id" =~ ^[0-9]+$ ]] || {
            echo "::error::No successful production run has a non-expired evidence artifact for current main ${main_sha}."
            exit 1
          }

          evidence="$(find "${selected_dir}/unzipped" -type f -name 'production-deployment.txt' -print -quit)"
          approval_history="$(find "${selected_dir}/unzipped" -type f -name 'approval-history.json' -print -quit)"

          rollback_run_id="$(awk -F= '$1=="rollback_run_id" {print $2}' "$evidence")"
          source_ci_run_id="$(awk -F= '$1=="source_ci_run_id" {print $2}' "$evidence")"
          github_artifact_name="$(awk -F= '$1=="github_artifact_name" {print $2}' "$evidence")"
          commit_sha="$(awk -F= '$1=="commit_sha" {print $2}' "$evidence")"
          artifact_sha256="$(awk -F= '$1=="artifact_sha256" {print $2}' "$evidence")"
          environment_id="$(awk -F= '$1=="production_environment_id" {print $2}' "$evidence")"
          reviewer_count="$(awk -F= '$1=="required_reviewer_count" {print $2}' "$evidence")"
          reviewers="$(awk -F= '$1=="required_reviewers" {print $2}' "$evidence")"
          prevent_self_review="$(awk -F= '$1=="prevent_self_review" {print $2}' "$evidence")"
          source_actor="$(awk -F= '$1=="workflow_source_actor" {print $2}' "$evidence")"
          approval_state="$(awk -F= '$1=="approval_state" {print $2}' "$evidence")"
          approver="$(awk -F= '$1=="approver" {print $2}' "$evidence")"
          deployment_url="$(awk -F= '$1=="deployment_url" {print $2}' "$evidence")"
          stable_production_url="$(awk -F= '$1=="stable_production_url" {print $2}' "$evidence")"
          result="$(awk -F= '$1=="result" {print $2}' "$evidence")"

          [[ "$rollback_run_id" =~ ^[0-9]+$ ]]
          [[ "$source_ci_run_id" =~ ^[0-9]+$ ]]
          [[ "$commit_sha" == "$main_sha" ]]
          [[ "$github_artifact_name" == "moventra-tms-${main_sha}" ]]
          [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$environment_id" =~ ^[0-9]+$ ]]
          [[ "$reviewer_count" =~ ^[0-9]+$ && "$reviewer_count" -ge 1 ]]
          [[ -n "$reviewers" ]]
          [[ "$prevent_self_review" == true ]]
          [[ "$approval_state" == approved ]]
          [[ -n "$approver" ]]
          [[ "$approver" != "$source_actor" ]]
          [[ "$deployment_url" == https://* ]]
          [[ "$stable_production_url" == https://* ]]
          [[ "$result" == success ]]

          production_run_json="$(api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${selected_run_id}")"
          test "$(jq -r '.name' <<< "$production_run_json")" = 'Moventra Production Promotion'
          test "$(jq -r '.conclusion' <<< "$production_run_json")" = success
          test "$(jq -r '.head_branch' <<< "$production_run_json")" = main

          rollback_run_json="$(api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${rollback_run_id}")"
          test "$(jq -r '.name' <<< "$rollback_run_json")" = 'Moventra Rollback Drill'
          test "$(jq -r '.conclusion' <<< "$rollback_run_json")" = success
          test "$(jq -r '.head_branch' <<< "$rollback_run_json")" = main

          source_run_json="$(api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${source_ci_run_id}")"
          test "$(jq -r '.name' <<< "$source_run_json")" = 'Moventra CI'
          test "$(jq -r '.conclusion' <<< "$source_run_json")" = success
          test "$(jq -r '.head_branch' <<< "$source_run_json")" = main
          test "$(jq -r '.head_sha' <<< "$source_run_json")" = "$main_sha"

          environment_json="$(api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/environments/production")"
          current_environment_id="$(jq -r '.id' <<< "$environment_json")"
          current_reviewer_count="$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' <<< "$environment_json")"
          current_prevent_self_review="$(jq -r '[.protection_rules[]? | select(.type == "required_reviewers")][0].prevent_self_review // false' <<< "$environment_json")"
          test "$current_environment_id" = "$environment_id"
          test "$current_reviewer_count" -ge 1
          test "$current_prevent_self_review" = true

          source_artifacts_json="$(api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${github_artifact_name}&per_page=100")"
          source_artifact_id="$(jq -r \
            --arg name "$github_artifact_name" \
            --arg sha "$main_sha" \
            --argjson run_id "$source_ci_run_id" \
            '[.artifacts[]
              | select(.name == $name)
              | select(.expired == false)
              | select(.workflow_run.id == $run_id)
              | select(.workflow_run.head_branch == "main")
              | select(.workflow_run.head_sha == $sha)]
             | first
             | .id // empty' <<< "$source_artifacts_json")"
          [[ "$source_artifact_id" =~ ^[0-9]+$ ]]

          mkdir -p audit/source-artifact
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${source_artifact_id}/zip" \
            --output audit/source-artifact.zip
          unzip -q audit/source-artifact.zip -d audit/source-artifact

          metadata="$(bash scripts/release/artifact-metadata.sh audit/source-artifact)"
          verified_commit_sha="$(printf '%s\n' "$metadata" | awk -F= '$1=="commit_sha" {print $2}')"
          verified_artifact_name="$(printf '%s\n' "$metadata" | awk -F= '$1=="github_artifact_name" {print $2}')"
          verified_artifact_sha256="$(printf '%s\n' "$metadata" | awk -F= '$1=="artifact_sha256" {print $2}')"
          test "$verified_commit_sha" = "$main_sha"
          test "$verified_artifact_name" = "$github_artifact_name"
          test "$verified_artifact_sha256" = "$artifact_sha256"

          cp "$evidence" audit/evidence/production-deployment.txt
          cp "$approval_history" audit/evidence/approval-history.json

          cat > audit/evidence/audit-summary.txt <<EOF
          product=Moventra TMS
          phase=004-CI-CD
          audit=authoritative-production-correlation
          main_sha=${main_sha}
          production_run_id=${selected_run_id}
          production_evidence_artifact_id=${selected_artifact_id}
          rollback_run_id=${rollback_run_id}
          source_ci_run_id=${source_ci_run_id}
          source_application_artifact_id=${source_artifact_id}
          github_artifact_name=${github_artifact_name}
          artifact_sha256=${artifact_sha256}
          production_environment_id=${environment_id}
          required_reviewer_count=${reviewer_count}
          required_reviewers=${reviewers}
          prevent_self_review=${prevent_self_review}
          workflow_source_actor=${source_actor}
          approval_state=${approval_state}
          approver=${approver}
          deployment_url=${deployment_url}
          stable_production_url=${stable_production_url}
          source_artifact_reverified=true
          result=success
          EOF

          cat audit/evidence/audit-summary.txt

      - name: Upload authoritative audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-evidence-audit
          path: audit/evidence/
          if-no-files-found: error
          retention-days: 90
