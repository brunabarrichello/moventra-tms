name: Moventra Rollback Drill

on:
  workflow_run:
    workflows: ["Moventra Release Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_gate_run_id:
        description: Successful Moventra Release Gate run ID to replay
        required: true
        type: string
      staging_url:
        description: Stable staging URL used for revision-aware smoke validation
        required: true
        default: https://moventra-tms-staging.vercel.app
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: moventra-staging-rollback-drill
  cancel-in-progress: false

jobs:
  rollback-drill:
    name: Provider-neutral prebuilt rollback drill
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_STAGING_PROJECT_ID }}
      VERCEL_PROJECT_NAME: moventra-tms-staging
      RELEASE_GATE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_gate_run_id }}
      STAGING_URL: ${{ github.event_name == 'workflow_run' && 'https://moventra-tms-staging.vercel.app' || inputs.staging_url }}
    steps:
      - name: Checkout release revision utilities
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false

      - name: Validate trusted release gate run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_GATE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::Invalid Release Gate run ID'; exit 1; }
          run_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_GATE_RUN_ID}")"
          test "$(jq -r '.name' <<< "$run_json")" = 'Moventra Release Gate'
          test "$(jq -r '.conclusion' <<< "$run_json")" = success
          test "$(jq -r '.head_branch' <<< "$run_json")" = main
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            test "${{ github.event.workflow_run.event }}" = workflow_run || {
              echo '::error::Automatic rollback only accepts Release Gate runs triggered by workflow_run.'
              exit 1
            }
          fi
          printf 'release_gate_run_id=%s\n' "$RELEASE_GATE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download trusted staging evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/release/github-download-artifact.sh \
            "${{ steps.gate.outputs.release_gate_run_id }}" \
            prefix \
            staging-deployment- \
            staging-evidence

      - name: Resolve current and rollback artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t evidence_files < <(find staging-evidence -type f -name 'staging-deployment.txt' -print)
          test "${#evidence_files[@]}" -eq 1 || {
            echo "::error::Expected exactly one staging evidence file, found ${#evidence_files[@]}"
            exit 1
          }
          evidence="${evidence_files[0]}"

          restore_sha="$(awk -F= '$1=="commit_sha" {print $2}' "$evidence")"
          restore_run_id="$(awk -F= '$1=="source_run_id" {print $2}' "$evidence")"
          restore_artifact_name="$(awk -F= '$1=="github_artifact_name" {print $2}' "$evidence")"
          staging_digest="$(awk -F= '$1=="artifact_sha256" {print $2}' "$evidence")"
          staging_result="$(awk -F= '$1=="result" {print $2}' "$evidence")"

          [[ "$restore_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$restore_run_id" =~ ^[0-9]+$ ]]
          [[ "$staging_digest" =~ ^[0-9a-f]{64}$ ]]
          test "$restore_artifact_name" = "moventra-tms-${restore_sha}"
          test "$staging_result" = success

          commit_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${restore_sha}")"
          parent_count="$(jq '.parents | length' <<< "$commit_json")"
          test "$parent_count" -eq 1 || {
            echo "::error::Expected linear-history commit with exactly one parent, found ${parent_count}"
            exit 1
          }
          rollback_sha="$(jq -r '.parents[0].sha' <<< "$commit_json")"
          [[ "$rollback_sha" =~ ^[0-9a-f]{40}$ ]]
          rollback_artifact_name="moventra-tms-${rollback_sha}"

          artifact_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${rollback_artifact_name}&per_page=100")"
          rollback_run_id="$(jq -r \
            --arg name "$rollback_artifact_name" \
            --arg sha "$rollback_sha" \
            '[.artifacts[]
              | select(.name == $name)
              | select(.expired == false)
              | select(.workflow_run.head_branch == "main")
              | select(.workflow_run.head_sha == $sha)]
             | sort_by(.created_at)
             | last
             | .workflow_run.id // empty' <<< "$artifact_json")"
          [[ "$rollback_run_id" =~ ^[0-9]+$ ]] || {
            echo "::error::No non-expired previous-main artifact was found for ${rollback_sha}"
            exit 1
          }

          {
            printf 'rollback_run_id=%s\n' "$rollback_run_id"
            printf 'rollback_artifact_name=%s\n' "$rollback_artifact_name"
            printf 'rollback_sha=%s\n' "$rollback_sha"
            printf 'restore_run_id=%s\n' "$restore_run_id"
            printf 'restore_artifact_name=%s\n' "$restore_artifact_name"
            printf 'restore_sha=%s\n' "$restore_sha"
            printf 'staging_artifact_sha256=%s\n' "$staging_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact restoration revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.restore_sha }}
          persist-credentials: false

      - name: Download rollback prebuilt artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/release/github-download-artifact.sh \
            "${{ steps.source.outputs.rollback_run_id }}" \
            exact \
            "${{ steps.source.outputs.rollback_artifact_name }}" \
            rollback-artifact

      - name: Download current prebuilt artifact for restoration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/release/github-download-artifact.sh \
            "${{ steps.source.outputs.restore_run_id }}" \
            exact \
            "${{ steps.source.outputs.restore_artifact_name }}" \
            restore-artifact

      - name: Validate staging deployment configuration
        id: credentials
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN is required'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo '::error::VERCEL_ORG_ID is required'; exit 1; }
          test -n "$VERCEL_PROJECT_NAME" || { echo '::error::VERCEL_PROJECT_NAME is required'; exit 1; }

      - name: Resolve current staging Vercel project ID
        id: vercel-project
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/vercel-project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_NAME}?teamId=${VERCEL_ORG_ID}")"
          test "$status" = "200" || {
            echo "::error::Vercel staging project ${VERCEL_PROJECT_NAME} is unavailable (HTTP ${status})"
            exit 1
          }
          project_id="$(node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('/tmp/vercel-project.json','utf8')); if(!p.id) process.exit(2); process.stdout.write(p.id)")"
          printf 'VERCEL_PROJECT_ID=%s\n' "$project_id" >> "$GITHUB_ENV"
          printf 'project_id=%s\n' "$project_id" >> "$GITHUB_OUTPUT"

      - name: Verify rollback artifact contract
        id: rollback_metadata
        env:
          EXPECTED_NAME: ${{ steps.source.outputs.rollback_artifact_name }}
          EXPECTED_SHA: ${{ steps.source.outputs.rollback_sha }}
        run: |
          set -euo pipefail
          metadata="$(bash scripts/release/artifact-metadata.sh rollback-artifact)"
          commit_sha="$(printf '%s\n' "$metadata" | awk -F= '$1=="commit_sha" {print $2}')"
          artifact_name="$(printf '%s\n' "$metadata" | awk -F= '$1=="github_artifact_name" {print $2}')"
          artifact_sha256="$(printf '%s\n' "$metadata" | awk -F= '$1=="artifact_sha256" {print $2}')"
          test "$artifact_name" = "$EXPECTED_NAME"
          test "$commit_sha" = "$EXPECTED_SHA"
          [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            printf 'commit_sha=%s\n' "$commit_sha"
            printf 'artifact_sha256=%s\n' "$artifact_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Verify restoration artifact contract
        id: restore_metadata
        env:
          EXPECTED_NAME: ${{ steps.source.outputs.restore_artifact_name }}
          EXPECTED_SHA: ${{ steps.source.outputs.restore_sha }}
          EXPECTED_DIGEST: ${{ steps.source.outputs.staging_artifact_sha256 }}
        run: |
          set -euo pipefail
          metadata="$(bash scripts/release/artifact-metadata.sh restore-artifact)"
          commit_sha="$(printf '%s\n' "$metadata" | awk -F= '$1=="commit_sha" {print $2}')"
          artifact_name="$(printf '%s\n' "$metadata" | awk -F= '$1=="github_artifact_name" {print $2}')"
          artifact_sha256="$(printf '%s\n' "$metadata" | awk -F= '$1=="artifact_sha256" {print $2}')"
          test "$artifact_name" = "$EXPECTED_NAME"
          test "$commit_sha" = "$EXPECTED_SHA"
          test "$artifact_sha256" = "$EXPECTED_DIGEST"
          test "$commit_sha" != "${{ steps.rollback_metadata.outputs.commit_sha }}"
          {
            printf 'commit_sha=%s\n' "$commit_sha"
            printf 'artifact_sha256=%s\n' "$artifact_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy rollback prebuilt artifact
        id: rollback
        run: |
          set -euo pipefail
          result="$(bash scripts/release/vercel-deploy-artifact.sh rollback-artifact)"
          printf '%s\n' "$result"
          while IFS='=' read -r key value; do
            case "$key" in
              deployment_url|commit_sha|artifact_sha256) printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done <<< "$result"

      - name: Smoke test rolled-back revision
        id: rollback_smoke
        env:
          DEPLOYMENT_URL: ${{ steps.rollback.outputs.deployment_url }}
          EXPECTED_SHA: ${{ steps.rollback_metadata.outputs.commit_sha }}
        run: |
          set -euo pipefail
          bash scripts/release/smoke-health.sh "$DEPLOYMENT_URL" "$EXPECTED_SHA"
          bash scripts/release/smoke-health.sh "$STAGING_URL" "$EXPECTED_SHA"

      - name: Restore current prebuilt artifact
        id: restore
        if: always() && steps.credentials.outcome == 'success' && steps.restore_metadata.outcome == 'success'
        run: |
          set -euo pipefail
          result="$(bash scripts/release/vercel-deploy-artifact.sh restore-artifact)"
          printf '%s\n' "$result"
          while IFS='=' read -r key value; do
            case "$key" in
              deployment_url|commit_sha|artifact_sha256) printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done <<< "$result"

      - name: Smoke test restored revision
        id: restore_smoke
        if: always() && steps.restore.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.restore.outputs.deployment_url }}
          EXPECTED_SHA: ${{ steps.restore_metadata.outputs.commit_sha }}
        run: |
          set -euo pipefail
          bash scripts/release/smoke-health.sh "$DEPLOYMENT_URL" "$EXPECTED_SHA"
          bash scripts/release/smoke-health.sh "$STAGING_URL" "$EXPECTED_SHA"

      - name: Record rollback evidence
        if: always()
        env:
          ROLLBACK_SHA: ${{ steps.rollback_metadata.outputs.commit_sha }}
          ROLLBACK_DIGEST: ${{ steps.rollback_metadata.outputs.artifact_sha256 }}
          ROLLBACK_URL: ${{ steps.rollback.outputs.deployment_url }}
          RESTORE_SHA: ${{ steps.restore_metadata.outputs.commit_sha }}
          RESTORE_DIGEST: ${{ steps.restore_metadata.outputs.artifact_sha256 }}
          RESTORE_URL: ${{ steps.restore.outputs.deployment_url }}
          ROLLBACK_DEPLOY: ${{ steps.rollback.outcome }}
          ROLLBACK_SMOKE: ${{ steps.rollback_smoke.outcome }}
          RESTORE_DEPLOY: ${{ steps.restore.outcome }}
          RESTORE_SMOKE: ${{ steps.restore_smoke.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/rollback-drill.txt <<EOF
          product=Moventra TMS
          phase=004-CI-CD
          gate=rollback-prebuilt-drill
          trigger=${GITHUB_EVENT_NAME}
          release_gate_run_id=${RELEASE_GATE_RUN_ID}
          workflow_actor=${GITHUB_ACTOR}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          rollback_source_run=${{ steps.source.outputs.rollback_run_id }}
          rollback_github_artifact=${{ steps.source.outputs.rollback_artifact_name }}
          rollback_commit_sha=${ROLLBACK_SHA}
          rollback_artifact_sha256=${ROLLBACK_DIGEST}
          rollback_deployment_url=${ROLLBACK_URL}
          rollback_deploy=${ROLLBACK_DEPLOY}
          rollback_smoke=${ROLLBACK_SMOKE}
          restore_source_run=${{ steps.source.outputs.restore_run_id }}
          restore_github_artifact=${{ steps.source.outputs.restore_artifact_name }}
          restore_commit_sha=${RESTORE_SHA}
          restore_artifact_sha256=${RESTORE_DIGEST}
          restore_deployment_url=${RESTORE_URL}
          restore_deploy=${RESTORE_DEPLOY}
          restore_smoke=${RESTORE_SMOKE}
          stable_staging_url=${STAGING_URL}
          EOF

      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollback-drill-${{ steps.source.outputs.restore_sha || github.run_id }}
          path: evidence/rollback-drill.txt
          if-no-files-found: error
          retention-days: 90

      - name: Enforce drill result
        if: always()
        env:
          ROLLBACK_DEPLOY: ${{ steps.rollback.outcome }}
          ROLLBACK_SMOKE: ${{ steps.rollback_smoke.outcome }}
          RESTORE_DEPLOY: ${{ steps.restore.outcome }}
          RESTORE_SMOKE: ${{ steps.restore_smoke.outcome }}
        run: |
          set -euo pipefail
          test "$ROLLBACK_DEPLOY" = success
          test "$ROLLBACK_SMOKE" = success
          test "$RESTORE_DEPLOY" = success
          test "$RESTORE_SMOKE" = success
