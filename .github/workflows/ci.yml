name: Moventra CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate mandatory platform files
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "LICENSE"
            "package.json"
            "package-lock.json"
            "eslint.config.js"
            "src/server.js"
            "src/core/database-health.js"
            "src/infrastructure/database/postgres.js"
            "src/modules/organization/tenant/tenant-domain.js"
            "src/modules/organization/tenant/tenant-repository.js"
            "src/modules/organization/company/company-domain.js"
            "src/modules/organization/company/company-repository.js"
            "src/modules/organization/branch/branch-domain.js"
            "src/modules/organization/branch/branch-repository.js"
            "src/modules/identity/user/user-domain.js"
            "src/modules/identity/user/user-repository.js"
            "src/modules/identity/membership/membership-domain.js"
            "src/modules/identity/membership/membership-repository.js"
            "api/database-health.js"
            "scripts/ci/lint.sh"
            "scripts/ci/test.sh"
            "scripts/ci/build.sh"
            "scripts/ci/build-vercel-output.mjs"
            "scripts/db/migrate.mjs"
            "db/migrations/0001_foundation.sql"
            "db/migrations/0002_tenant.sql"
            "db/migrations/0003_company.sql"
            "db/migrations/0004_branch.sql"
            "db/migrations/0005_user.sql"
            "db/migrations/0006_membership.sql"
            "db/validation/0001_foundation_validation.sql"
            "db/validation/0002_tenant_validation.sql"
            "db/validation/0003_company_validation.sql"
            "db/validation/0004_branch_validation.sql"
            "db/validation/0005_user_validation.sql"
            "db/validation/0006_membership_validation.sql"
            ".github/workflows/release-gate.yml"
            ".github/workflows/rollback-drill.yml"
            ".github/workflows/production-promotion.yml"
            "docs/data/DATA-CONVENTIONS.md"
            "docs/implementation/004-cicd.md"
            "docs/implementation/005-secrets-management.md"
            "docs/implementation/006-banco-base.md"
            "docs/implementation/007-convencoes-de-dados.md"
            "docs/implementation/008-tenant.md"
            "docs/implementation/009-empresa.md"
            "docs/implementation/010-filial.md"
            "docs/implementation/011-usuarios.md"
            "docs/implementation/012-memberships.md"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "::error file=$file::Mandatory platform file is missing"; exit 1; }
          done

          for hook in scripts/ci/lint.sh scripts/ci/test.sh scripts/ci/build.sh; do
            test -x "$hook" || { echo "::error file=$hook::CI hook must be executable"; exit 1; }
          done

      - name: Reject tracked environment secret files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.example$'; then
            echo "::error::Tracked .env files are forbidden."
            exit 1
          fi

  lint:
    name: Lint
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: ./scripts/ci/lint.sh

  tests:
    name: Tests
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ./scripts/ci/test.sh

  security-baseline:
    name: Security baseline
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject high-risk tracked secret material
        run: |
          set -euo pipefail
          forbidden='(^|/)(id_rsa|id_ed25519|.*\.pem|.*\.p12|.*\.pfx|credentials\.json|service-account.*\.json)$'
          if git ls-files | grep -E "$forbidden"; then
            echo "::error::Potential credential/key material is tracked by Git."
            exit 1
          fi

  runtime-dependencies:
    name: PostgreSQL runtime dependencies
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify dependency tree and adapter import
        run: |
          set -euo pipefail
          npm ls --all
          node --input-type=module -e "await import('./src/infrastructure/database/postgres.js')"
          node --input-type=module -e "await import('./src/modules/organization/tenant/tenant-repository.js')"
          node --input-type=module -e "await import('./src/modules/organization/company/company-repository.js')"
          node --input-type=module -e "await import('./src/modules/organization/branch/branch-repository.js')"
          node --input-type=module -e "await import('./src/modules/identity/user/user-repository.js')"
          node --input-type=module -e "await import('./src/modules/identity/membership/membership-repository.js')"

  database-contract:
    name: PostgreSQL migration contract
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: moventra_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: moventra-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moventra_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: moventra_ci
      PGUSER: postgres
      PGPASSWORD: moventra-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Apply migrations to a clean PostgreSQL database
        run: node scripts/db/migrate.mjs
      - name: Re-run migrations to prove idempotent history behavior
        run: node scripts/db/migrate.mjs
      - name: Validate every database contract
        run: |
          set -euo pipefail
          shopt -s nullglob
          validations=(db/validation/*_validation.sql)
          test "${#validations[@]}" -gt 0 || { echo "::error::No database validation contracts found"; exit 1; }
          for validation in "${validations[@]}"; do
            echo "Validating ${validation}"
            psql -X --no-psqlrc -v ON_ERROR_STOP=1 -f "$validation"
          done

  build:
    name: Build immutable artifact
    needs: [lint, tests, security-baseline, runtime-dependencies, database-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build once
        run: ./scripts/ci/build.sh
      - name: Upload immutable application artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moventra-tms-${{ github.sha }}
          path: dist/artifacts/
          if-no-files-found: error
          retention-days: 90

  evidence:
    name: CI evidence
    needs: [repository-contract, lint, tests, security-baseline, runtime-dependencies, database-contract, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Produce execution evidence
        env:
          CONTRACT_RESULT: ${{ needs.repository-contract.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          SECURITY_RESULT: ${{ needs.security-baseline.result }}
          RUNTIME_DEPS_RESULT: ${{ needs.runtime-dependencies.result }}
          DATABASE_RESULT: ${{ needs.database-contract.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/ci-run.txt <<EOF
          product=Moventra TMS
          phase=platform
          repository=${GITHUB_REPOSITORY}
          commit_sha=${GITHUB_SHA}
          ref=${GITHUB_REF}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          actor=${GITHUB_ACTOR}
          repository_contract=${CONTRACT_RESULT}
          lint=${LINT_RESULT}
          tests=${TEST_RESULT}
          security_baseline=${SECURITY_RESULT}
          runtime_dependencies=${RUNTIME_DEPS_RESULT}
          database_contract=${DATABASE_RESULT}
          build=${BUILD_RESULT}
          EOF

          for result in "$CONTRACT_RESULT" "$LINT_RESULT" "$TEST_RESULT" "$SECURITY_RESULT" "$RUNTIME_DEPS_RESULT" "$DATABASE_RESULT" "$BUILD_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::One or more CI controls failed."
              exit 1
            fi
          done

      - name: Upload CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-${{ github.sha }}
          path: evidence/ci-run.txt
          if-no-files-found: error
          retention-days: 90
