name: Moventra CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate mandatory foundation files
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "LICENSE"
            "package.json"
            "src/server.js"
            "scripts/ci/lint.sh"
            "scripts/ci/test.sh"
            "scripts/ci/build.sh"
            "docs/implementation/004-cicd.md"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "::error file=$file::Mandatory foundation file is missing"; exit 1; }
          done

          for hook in scripts/ci/lint.sh scripts/ci/test.sh scripts/ci/build.sh; do
            test -x "$hook" || { echo "::error file=$hook::CI hook must be executable"; exit 1; }
          done

      - name: Reject tracked environment secret files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.example$'; then
            echo "::error::Tracked .env files are forbidden."
            exit 1
          fi

  lint:
    name: Lint
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/ci/lint.sh

  tests:
    name: Tests
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/ci/test.sh

  security-baseline:
    name: Security baseline
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject high-risk tracked secret material
        run: |
          set -euo pipefail
          forbidden='(^|/)(id_rsa|id_ed25519|.*\.pem|.*\.p12|.*\.pfx|credentials\.json|service-account.*\.json)$'
          if git ls-files | grep -E "$forbidden"; then
            echo "::error::Potential credential/key material is tracked by Git."
            exit 1
          fi

  build:
    name: Build immutable artifact
    needs: [lint, tests, security-baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build once
        run: ./scripts/ci/build.sh
      - name: Upload immutable application artifact
        uses: actions/upload-artifact@v4
        with:
          name: moventra-tms-${{ github.sha }}
          path: dist/artifacts/
          if-no-files-found: error
          retention-days: 30

  evidence:
    name: CI evidence
    needs: [repository-contract, lint, tests, security-baseline, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Produce execution evidence
        env:
          CONTRACT_RESULT: ${{ needs.repository-contract.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          SECURITY_RESULT: ${{ needs.security-baseline.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/ci-run.txt <<EOF
          product=Moventra TMS
          phase=004-CI-CD
          repository=${GITHUB_REPOSITORY}
          commit_sha=${GITHUB_SHA}
          ref=${GITHUB_REF}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          actor=${GITHUB_ACTOR}
          repository_contract=${CONTRACT_RESULT}
          lint=${LINT_RESULT}
          tests=${TEST_RESULT}
          security_baseline=${SECURITY_RESULT}
          build=${BUILD_RESULT}
          EOF

          for result in "$CONTRACT_RESULT" "$LINT_RESULT" "$TEST_RESULT" "$SECURITY_RESULT" "$BUILD_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::One or more CI controls failed."
              exit 1
            fi
          done

      - name: Upload CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.sha }}
          path: evidence/ci-run.txt
          if-no-files-found: error
          retention-days: 30
