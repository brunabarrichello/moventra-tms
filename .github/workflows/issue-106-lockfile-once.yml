name: Issue 106 lockfile one-shot

on:
  push:
    branches: [feat/issue-106-messaging-rabbitmq]

permissions:
  contents: write

concurrency:
  group: issue-106-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate exact npm lockfile and remove one-shot workflow
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          rm .github/workflows/issue-106-lockfile-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/issue-106-lockfile-once.yml
          git diff --cached --check
          git commit -m "build(messaging): lock amqplib 2.0.1 [lockfile-generated]"
          git push origin HEAD:${GITHUB_REF_NAME}
