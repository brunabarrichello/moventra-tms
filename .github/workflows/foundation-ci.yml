name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required foundation documents
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "docs/governance/PROJECT-GOVERNANCE.md"
            "docs/architecture/ADR-0001-modular-monolith.md"
            "docs/architecture/ENVIRONMENTS.md"
            "docs/security/SECRETS-POLICY.md"
            "docs/data/DATA-CONVENTIONS.md"
            "docs/security/TENANCY-RBAC-AUDIT.md"
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Reject tracked dotenv files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '\.env\.example$'; then
            echo "Tracked dotenv secret file detected."
            exit 1
          fi

      - name: Detect obvious database credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'postgres(ql)?://[^[:space:]]+:[^[:space:]@]+@' -- ':!*.example' ':!docs/security/SECRETS-POLICY.md'; then
            echo "Possible database credential detected."
            exit 1
          fi
