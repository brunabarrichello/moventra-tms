name: Moventra Release Gate

on:
  workflow_run:
    workflows: ["Moventra CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: GitHub Actions run ID that produced the immutable prebuilt artifact
        required: true
        type: string
      artifact_name:
        description: GitHub artifact name (moventra-tms-<commit-sha>)
        required: true
        type: string
      staging_url:
        description: Stable staging URL
        required: true
        default: https://moventra-tms-staging.vercel.app
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: moventra-release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.artifact_name }}
  cancel-in-progress: false

jobs:
  staging:
    name: Staging prebuilt deployment
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_STAGING_PROJECT_ID }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.artifact_run_id }}
      SELECTED_ARTIFACT_NAME: ${{ github.event_name == 'workflow_run' && format('moventra-tms-{0}', github.event.workflow_run.head_sha) || inputs.artifact_name }}
      STAGING_URL: ${{ github.event_name == 'workflow_run' && 'https://moventra-tms-staging.vercel.app' || inputs.staging_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve immutable artifact source
        id: source
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID" || { echo '::error::Source workflow run ID is required'; exit 1; }
          test -n "$SELECTED_ARTIFACT_NAME" || { echo '::error::Artifact name is required'; exit 1; }
          if [[ "${GITHUB_EVENT_NAME}" == workflow_run ]]; then
            test "${{ github.event.workflow_run.event }}" = push || {
              echo '::error::Automatic staging only accepts artifacts from push events.'
              exit 1
            }
            test "${{ github.event.workflow_run.head_branch }}" = main || {
              echo '::error::Automatic staging only accepts the main branch.'
              exit 1
            }
          fi
          printf 'source_run_id=%s\n' "$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'github_artifact_name=%s\n' "$SELECTED_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download immutable prebuilt artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.source.outputs.github_artifact_name }}
          path: release-artifact
          run-id: ${{ steps.source.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Validate staging deployment configuration
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN is required'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo '::error::VERCEL_ORG_ID is required'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo '::error::VERCEL_STAGING_PROJECT_ID is required'; exit 1; }

      - name: Verify immutable artifact contract
        id: metadata
        env:
          EXPECTED_ARTIFACT_NAME: ${{ steps.source.outputs.github_artifact_name }}
        run: |
          set -euo pipefail
          metadata="$(bash scripts/release/artifact-metadata.sh release-artifact)"
          printf '%s\n' "$metadata"
          commit_sha="$(printf '%s\n' "$metadata" | awk -F= '$1=="commit_sha" {print $2}')"
          github_artifact_name="$(printf '%s\n' "$metadata" | awk -F= '$1=="github_artifact_name" {print $2}')"
          artifact_sha256="$(printf '%s\n' "$metadata" | awk -F= '$1=="artifact_sha256" {print $2}')"
          test "$EXPECTED_ARTIFACT_NAME" = "$github_artifact_name"
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"
          printf 'artifact_sha256=%s\n' "$artifact_sha256" >> "$GITHUB_OUTPUT"

      - name: Enforce automatic main revision identity
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_SHA: ${{ steps.metadata.outputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$ARTIFACT_SHA" = "$EXPECTED_SHA" || {
            echo "::error::Artifact revision $ARTIFACT_SHA does not match triggering main SHA $EXPECTED_SHA"
            exit 1
          }

      - name: Deploy exact prebuilt artifact to staging
        id: deploy
        run: |
          set -euo pipefail
          result="$(bash scripts/release/vercel-deploy-artifact.sh release-artifact)"
          printf '%s\n' "$result"
          while IFS='=' read -r key value; do
            case "$key" in
              deployment_url|commit_sha|artifact_sha256)
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done <<< "$result"

      - name: Verify staging revision identity
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          EXPECTED_SHA: ${{ steps.metadata.outputs.commit_sha }}
        run: |
          set -euo pipefail
          bash scripts/release/smoke-health.sh "$DEPLOYMENT_URL" "$EXPECTED_SHA"
          bash scripts/release/smoke-health.sh "$STAGING_URL" "$EXPECTED_SHA"

      - name: Record staging evidence
        env:
          COMMIT_SHA: ${{ steps.metadata.outputs.commit_sha }}
          ARTIFACT_SHA256: ${{ steps.metadata.outputs.artifact_sha256 }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/staging-deployment.txt <<EOF
          product=Moventra TMS
          phase=004-CI-CD
          gate=staging-prebuilt-deployment
          trigger=${GITHUB_EVENT_NAME}
          source_run_id=${SOURCE_RUN_ID}
          github_artifact_name=${SELECTED_ARTIFACT_NAME}
          commit_sha=${COMMIT_SHA}
          artifact_sha256=${ARTIFACT_SHA256}
          deployment_url=${DEPLOYMENT_URL}
          stable_url=${STAGING_URL}
          workflow_actor=${GITHUB_ACTOR}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          result=success
          EOF

      - name: Upload staging evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-deployment-${{ steps.metadata.outputs.commit_sha }}
          path: evidence/staging-deployment.txt
          if-no-files-found: error
          retention-days: 90
