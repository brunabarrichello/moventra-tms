name: Moventra Release Gate

on:
  workflow_run:
    workflows: ["Moventra CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: GitHub Actions run ID that produced the immutable prebuilt artifact
        required: true
        type: string
      artifact_name:
        description: GitHub artifact name (moventra-tms-<commit-sha>)
        required: true
        type: string
      staging_url:
        description: Stable staging URL
        required: true
        default: https://moventra-tms-staging-alebru.vercel.app
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: moventra-release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.artifact_name }}
  cancel-in-progress: false

jobs:
  impact:
    name: Classify release impact
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      requires_release: ${{ steps.classify.outputs.requires_release }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 2
          persist-credentials: false

      - name: Classify application release impact
        id: classify
        env:
          UPSTREAM_EVENT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$UPSTREAM_EVENT" == workflow_dispatch ]]; then
            {
              echo 'requires_release=true'
              echo 'classification=manual-release'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_sha='${{ github.event.workflow_run.head_sha }}'
          base_sha="$(git rev-parse "${head_sha}^")"
          result="$(bash scripts/release/classify-release-impact.sh "$base_sha" "$head_sha")"
          printf '%s\n' "$result"
          while IFS='=' read -r key value; do
            case "$key" in
              requires_release|classification)
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done <<< "$result"

  staging:
    name: Staging prebuilt deployment
    needs: impact
    if: ${{ needs.impact.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.impact.outputs.requires_release == 'true') }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_NAME: moventra-tms-staging
      VERCEL_NODE_VERSION: 22.x
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.artifact_run_id }}
      SELECTED_ARTIFACT_NAME: ${{ github.event_name == 'workflow_run' && format('moventra-tms-{0}', github.event.workflow_run.head_sha) || inputs.artifact_name }}
      STAGING_URL: ${{ github.event_name == 'workflow_run' && 'https://moventra-tms-staging-alebru.vercel.app' || inputs.staging_url }}
    steps:
      - name: Resolve and validate immutable CI source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::Source workflow run ID is required'; exit 1; }
          run_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.name' <<< "$run_json")" = 'Moventra CI' || { echo '::error::Source run is not Moventra CI'; exit 1; }
          test "$(jq -r '.conclusion' <<< "$run_json")" = success || { echo '::error::Source Moventra CI run must be successful'; exit 1; }
          test "$(jq -r '.head_branch' <<< "$run_json")" = main || { echo '::error::Source Moventra CI run must originate from main'; exit 1; }
          source_event="$(jq -r '.event' <<< "$run_json")"
          case "$source_event" in
            push|workflow_dispatch) ;;
            *) echo "::error::Unsupported Moventra CI source event: ${source_event}"; exit 1 ;;
          esac
          source_sha="$(jq -r '.head_sha' <<< "$run_json")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid source revision'; exit 1; }
          expected_artifact_name="moventra-tms-${source_sha}"
          test "$SELECTED_ARTIFACT_NAME" = "$expected_artifact_name" || {
            echo "::error::Selected artifact ${SELECTED_ARTIFACT_NAME} does not match source revision ${source_sha}"
            exit 1
          }
          main_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main")"
          current_main_sha="$(jq -r '.object.sha' <<< "$main_json")"
          test "$current_main_sha" = "$source_sha" || {
            echo "::error::Release candidate ${source_sha} is stale; current main is ${current_main_sha}"
            exit 1
          }
          {
            printf 'source_run_id=%s\n' "$SOURCE_RUN_ID"
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_event=%s\n' "$source_event"
            printf 'github_artifact_name=%s\n' "$expected_artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact immutable candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install locked runtime and smoke dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Validate protected staging credentials
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
          MESSAGING_RABBITMQ_URL: ${{ secrets.MESSAGING_RABBITMQ_URL }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN is required'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo '::error::VERCEL_ORG_ID is required'; exit 1; }
          test -n "$VERCEL_PROJECT_NAME" || { echo '::error::VERCEL_PROJECT_NAME is required'; exit 1; }
          test -n "$DATABASE_URL" || { echo '::error::DATABASE_URL is required in the protected GitHub staging environment'; exit 1; }
          test -n "$MIGRATIONS_DATABASE_URL" || { echo '::error::MIGRATIONS_DATABASE_URL is required in the protected GitHub staging environment'; exit 1; }
          test -n "$MESSAGING_RABBITMQ_URL" || { echo '::error::MESSAGING_RABBITMQ_URL is required in the protected GitHub staging environment'; exit 1; }

      - name: Converge staging Vercel project
        id: vercel-project
        run: |
          set -euo pipefail
          result="$(bash scripts/release/ensure-vercel-project.sh)"
          printf '%s\n' "$result"
          while IFS='=' read -r key value; do
            case "$key" in
              project_id)
                printf 'VERCEL_PROJECT_ID=%s\n' "$value" >> "$GITHUB_ENV"
                printf 'project_id=%s\n' "$value" >> "$GITHUB_OUTPUT"
                ;;
              node_version) printf 'node_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done <<< "$result"

      - name: Synchronize staging DATABASE_URL to Vercel
        env:
          VERCEL_PROJECT_ID: ${{ steps.vercel-project.outputs.project_id }}
          VERCEL_ENV_KEY: DATABASE_URL
          VERCEL_ENV_VALUE: ${{ secrets.DATABASE_URL }}
          VERCEL_ENV_TARGET: production
          VERCEL_ENV_COMMENT: Moventra staging runtime database credential managed by protected release automation
        run: |
          set -euo pipefail
          bash scripts/release/vercel-upsert-sensitive-env.sh

      - name: Synchronize staging RabbitMQ runtime contract to Vercel
        env:
          VERCEL_PROJECT_ID: ${{ steps.vercel-project.outputs.project_id }}
          MESSAGING_RABBITMQ_URL: ${{ secrets.MESSAGING_RABBITMQ_URL }}
        run: |
          set -euo pipefail
          bash scripts/release/sync-messaging-env-to-vercel.sh

      - name: Download immutable prebuilt artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/release/github-download-artifact.sh \
            "${{ steps.source.outputs.source_run_id }}" \
            exact \
            "${{ steps.source.outputs.github_artifact_name }}" \
            release-artifact

      - name: Verify immutable artifact contract
        id: metadata
        env:
          EXPECTED_ARTIFACT_NAME: ${{ steps.source.outputs.github_artifact_name }}
          EXPECTED_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          metadata="$(bash scripts/release/artifact-metadata.sh release-artifact)"
          printf '%s\n' "$metadata"
          commit_sha="$(printf '%s\n' "$metadata" | awk -F= '$1=="commit_sha" {print $2}')"
          github_artifact_name="$(printf '%s\n' "$metadata" | awk -F= '$1=="github_artifact_name" {print $2}')"
          artifact_sha256="$(printf '%s\n' "$metadata" | awk -F= '$1=="artifact_sha256" {print $2}')"
          test "$EXPECTED_ARTIFACT_NAME" = "$github_artifact_name"
          test "$commit_sha" = "$EXPECTED_SHA"
          [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"
          printf 'artifact_sha256=%s\n' "$artifact_sha256" >> "$GITHUB_OUTPUT"

      - name: Apply governed staging database migrations
        id: migration
        env:
          MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
        run: |
          set -euo pipefail
          result="$(bash scripts/release/apply-database-migrations.sh)"
          printf '%s\n' "$result"
          while IFS='=' read -r key value; do
            case "$key" in
              database_migration_max|database_migration_name|database_migration_checksum)
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done <<< "$result"

      - name: Deploy exact prebuilt artifact to staging
        id: deploy
        run: |
          set -euo pipefail
          result="$(bash scripts/release/vercel-deploy-artifact.sh release-artifact)"
          printf '%s\n' "$result"
          while IFS='=' read -r key value; do
            case "$key" in
              deployment_url|commit_sha|artifact_sha256|auth_provider_key|auth_algorithm|auth_kid|auth_public_key_sha256)
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done <<< "$result"

      - name: Verify staging revision identity
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          EXPECTED_SHA: ${{ steps.metadata.outputs.commit_sha }}
        run: |
          set -euo pipefail
          bash scripts/release/smoke-health.sh "$DEPLOYMENT_URL" "$EXPECTED_SHA"
          bash scripts/release/smoke-health.sh "$STAGING_URL" "$EXPECTED_SHA"

      - name: Verify staging database readiness
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          EXPECTED_SHA: ${{ steps.metadata.outputs.commit_sha }}
        run: |
          set -euo pipefail
          bash scripts/release/smoke-database-health.sh "$DEPLOYMENT_URL" "$EXPECTED_SHA"
          bash scripts/release/smoke-database-health.sh "$STAGING_URL" "$EXPECTED_SHA"

      - name: Verify staging messaging readiness
        env:
          MOVENTRA_ENV: staging
          MESSAGING_PROVIDER: rabbitmq
          MESSAGING_RABBITMQ_URL: ${{ secrets.MESSAGING_RABBITMQ_URL }}
          MESSAGING_PREFETCH: 1
          MESSAGING_PUBLISH_CONFIRM_TIMEOUT_MS: 5000
        run: node scripts/release/smoke-messaging.mjs

      - name: Verify authenticated DLQ Admin and Vercel RabbitMQ runtime
        id: dlq-admin-smoke
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
          MOVENTRA_AUTH_ENVIRONMENT: staging
        run: |
          set -euo pipefail
          result="$(node scripts/release/smoke-dlq-admin.mjs)"
          printf '%s\n' "$result"
          test "$(jq -r '.status' <<< "$result")" = ok
          test "$(jq -r '.authenticatedList' <<< "$result")" = success
          test "$(jq -r '.tenantRbacRlsDetail' <<< "$result")" = success
          test "$(jq -r '.governedMessageReprocess' <<< "$result")" = success
          test "$(jq -r '.vercelRuntimeRabbitMqConfirm' <<< "$result")" = success
          test "$(jq -r '.idempotentReplay' <<< "$result")" = success
          printf 'auth_subject_sha256=%s\n' "$(jq -r '.authSubjectSha256' <<< "$result")" >> "$GITHUB_OUTPUT"

      - name: Record staging evidence
        env:
          COMMIT_SHA: ${{ steps.metadata.outputs.commit_sha }}
          ARTIFACT_SHA256: ${{ steps.metadata.outputs.artifact_sha256 }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          VERCEL_PROJECT_ID: ${{ steps.vercel-project.outputs.project_id }}
          VERCEL_NODE_VERSION_EFFECTIVE: ${{ steps.vercel-project.outputs.node_version }}
          DATABASE_MIGRATION_MAX: ${{ steps.migration.outputs.database_migration_max }}
          DATABASE_MIGRATION_NAME: ${{ steps.migration.outputs.database_migration_name }}
          DATABASE_MIGRATION_CHECKSUM: ${{ steps.migration.outputs.database_migration_checksum }}
          AUTH_PROVIDER_KEY: ${{ steps.deploy.outputs.auth_provider_key }}
          AUTH_ALGORITHM: ${{ steps.deploy.outputs.auth_algorithm }}
          AUTH_KID: ${{ steps.deploy.outputs.auth_kid }}
          AUTH_PUBLIC_KEY_SHA256: ${{ steps.deploy.outputs.auth_public_key_sha256 }}
          AUTH_SMOKE_SUBJECT_SHA256: ${{ steps.dlq-admin-smoke.outputs.auth_subject_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/staging-deployment.txt <<EOF
          product=Moventra TMS
          phase=004-CI-CD
          gate=staging-prebuilt-deployment
          trigger=${GITHUB_EVENT_NAME}
          source_event=${{ steps.source.outputs.source_event }}
          source_run_id=${SOURCE_RUN_ID}
          github_artifact_name=${SELECTED_ARTIFACT_NAME}
          commit_sha=${COMMIT_SHA}
          artifact_sha256=${ARTIFACT_SHA256}
          database_migration_max=${DATABASE_MIGRATION_MAX}
          database_migration_name=${DATABASE_MIGRATION_NAME}
          database_migration_checksum=${DATABASE_MIGRATION_CHECKSUM}
          database_migration_promotion=success
          vercel_project_name=${VERCEL_PROJECT_NAME}
          vercel_project_id=${VERCEL_PROJECT_ID}
          vercel_node_version=${VERCEL_NODE_VERSION_EFFECTIVE}
          database_url_synced=true
          messaging_url_synced=true
          messaging_provider=rabbitmq
          application_health=success
          database_health=success
          messaging_readiness=success
          auth_provider_key=${AUTH_PROVIDER_KEY}
          auth_algorithm=${AUTH_ALGORITHM}
          auth_kid=${AUTH_KID}
          auth_public_key_sha256=${AUTH_PUBLIC_KEY_SHA256}
          auth_smoke_subject_sha256=${AUTH_SMOKE_SUBJECT_SHA256}
          dlq_admin_auth_e2e=success
          dlq_tenant_rbac_rls=success
          dlq_message_reprocess=success
          vercel_runtime_messaging=success
          dlq_http_idempotency=success
          deployment_url=${DEPLOYMENT_URL}
          stable_url=${STAGING_URL}
          workflow_actor=${GITHUB_ACTOR}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          result=success
          EOF

      - name: Upload staging evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-deployment-${{ steps.metadata.outputs.commit_sha }}
          path: evidence/staging-deployment.txt
          if-no-files-found: error
          retention-days: 90
