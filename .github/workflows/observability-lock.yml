name: Observability Lock Generation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  generate-lock:
    name: Generate npm lock for observability dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate locked dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund && npm ls --all
      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observability-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
