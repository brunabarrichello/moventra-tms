name: Observability Lock Generation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  generate-lock:
    name: Generate npm lock for observability dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate locked dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund && npm ls --all
      - name: Commit generated lockfile to feature branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(observability): lock OpenTelemetry dependencies"
          git push origin "HEAD:${HEAD_BRANCH}"
