name: Audit 005 Secrets Metadata

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  metadata:
    name: Read-only secrets metadata audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: 07762976aa58a10b872538bc6629c99481ed6e2d
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enumerate canonical main runs
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" \
            > /tmp/runs.json

          jq -r '
            .workflow_runs
            | sort_by(.created_at)
            | .[]
            | [(.id|tostring), .name, .event, .status, (.conclusion // "null"), .head_branch, .head_sha, .created_at]
            | @tsv
          ' /tmp/runs.json

      - name: Read environment configuration metadata
        run: |
          set -euo pipefail
          for environment_name in staging production; do
            echo "--- environment=${environment_name} ---"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/environments/${environment_name}" \
              | jq -r '[.name, (.id|tostring), (.protection_rules|length|tostring), (.deployment_branch_policy.protected_branches|tostring), (.deployment_branch_policy.custom_branch_policies|tostring)] | @tsv'
          done

      - name: Attempt safe environment secret metadata listing
        run: |
          set -euo pipefail
          for environment_name in staging production; do
            response="/tmp/${environment_name}-secrets.json"
            http_code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/environments/${environment_name}/secrets?per_page=100")"

            echo "environment=${environment_name} secret_metadata_http=${http_code}"
            if [[ "$http_code" == 200 ]]; then
              jq -r '.secrets[]? | [.name, .created_at, .updated_at] | @tsv' "$response"
            else
              jq -r '.message // "metadata unavailable"' "$response"
            fi
          done

