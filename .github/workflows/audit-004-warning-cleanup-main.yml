name: Audit 004 Warning Cleanup Main

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: phase/004-warning-cleanup-round2
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enumerate remediation branch runs
        run: |
          set -euo pipefail
          branch="$(python - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['TARGET_BRANCH'], safe=''))
          PY
          )"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&per_page=100" \
            > /tmp/runs.json

          jq -r '
            .workflow_runs
            | sort_by(.created_at)
            | .[]
            | [
                (.id|tostring),
                .name,
                .event,
                .status,
                (.conclusion // "null"),
                .head_branch,
                .head_sha,
                .created_at
              ]
            | @tsv
          ' /tmp/runs.json
