name: Audit 004 Warning Cleanup Main

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: 079d798368e47b44cbc28f9ed027446d8af0d2a8
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enumerate canonical main runs
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" \
            > /tmp/runs.json

          jq -r '
            .workflow_runs
            | sort_by(.created_at)
            | .[]
            | [
                (.id|tostring),
                .name,
                .event,
                .status,
                (.conclusion // "null"),
                .head_branch,
                .head_sha,
                .created_at
              ]
            | @tsv
          ' /tmp/runs.json
