name: Temp 004 Warning Round2 Codemod

on:
  push:
    branches: [phase/004-warning-cleanup-round2]

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase/004-warning-cleanup-round2
          fetch-depth: 0

      - name: Apply deterministic warning cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_download = 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1'
          new_download = 'actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0'

          for name in [
              '.github/workflows/release-gate.yml',
              '.github/workflows/rollback-drill.yml',
              '.github/workflows/production-promotion.yml',
          ]:
              path = Path(name)
              text = path.read_text()
              if old_download not in text:
                  raise SystemExit(f'expected download-artifact v8 pin missing in {name}')
              path.write_text(text.replace(old_download, new_download))

          for name in [
              'scripts/release/smoke-health.sh',
              'scripts/release/vercel-deploy-artifact.sh',
              'tests/integration/release-scripts.test.js',
          ]:
              path = Path(name)
              text = path.read_text()
              if '59.3.0' not in text:
                  raise SystemExit(f'expected Vercel 59.3.0 reference missing in {name}')
              path.write_text(text.replace('59.3.0', '59.4.0'))

          smoke = Path('scripts/release/smoke-health.sh')
          text = smoke.read_text()
          old = '    NPM_CONFIG_LOGLEVEL=error \\\n    VERCEL_TELEMETRY_DISABLED=1 \\\n'
          new = '    NPM_CONFIG_LOGLEVEL=error \\\n    NO_UPDATE_NOTIFIER=1 \\\n    VERCEL_TELEMETRY_DISABLED=1 \\\n'
          if old not in text:
              raise SystemExit('expected smoke npx environment block not found')
          smoke.write_text(text.replace(old, new))

          deploy = Path('scripts/release/vercel-deploy-artifact.sh')
          text = deploy.read_text()
          old = 'NPM_CONFIG_LOGLEVEL=error VERCEL_TELEMETRY_DISABLED=1 npx'
          new = 'NPM_CONFIG_LOGLEVEL=error NO_UPDATE_NOTIFIER=1 VERCEL_TELEMETRY_DISABLED=1 npx'
          if old not in text:
              raise SystemExit('expected deploy npx environment block not found')
          deploy.write_text(text.replace(old, new))

          hygiene = Path('tests/integration/workflow-runtime-hygiene.test.js')
          text = hygiene.read_text()
          old = "['actions/download-artifact', '3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c'], // v8.0.1"
          new = "['actions/download-artifact', '37930b1c2abaa49bbe596cd826c3c89aef350131'], // v7.0.0"
          if old not in text:
              raise SystemExit('expected v8 approved action pin not found')
          text = text.replace(old, new)
          old_assert = "    assert.match(script, /VERCEL_TELEMETRY_DISABLED=1/, `${relativePath} must disable Vercel telemetry output`);"
          new_assert = "    assert.match(script, /NO_UPDATE_NOTIFIER=1/, `${relativePath} must disable Vercel update-notifier output`);\n    assert.match(script, /VERCEL_TELEMETRY_DISABLED=1/, `${relativePath} must disable Vercel telemetry output`);"
          if old_assert not in text:
              raise SystemExit('expected telemetry assertion not found')
          hygiene.write_text(text.replace(old_assert, new_assert))

          doc = Path('docs/implementation/004-warning-hygiene-2026-08-22.md')
          text = doc.read_text()
          text += '''\n## Round 2 — evidência canônica\n\nA execução canônica após a primeira remediação revelou dois resíduos não reproduzidos no PR:\n\n- `actions/download-artifact` v8.0.1 emitiu `DEP0005 DeprecationWarning: Buffer()` no GitHub-hosted runner;\n- Vercel CLI 59.3.0 exibiu banner de atualização para 59.4.0.\n\nA correção adicional usa `actions/download-artifact` v7.0.0 (`37930b1c2abaa49bbe596cd826c3c89aef350131`), que mantém runtime Node.js 24 e é compatível com os inputs utilizados pelo Moventra, e fixa Vercel CLI 59.4.0. `NO_UPDATE_NOTIFIER=1` passa a impedir banners de atualização sem ocultar stderr ou exit codes.\n\nO pin v8.0.1 deixa de ser aprovado pelo teste de higiene, impedindo sua reintrodução enquanto o warning upstream persistir.\n'''
          doc.write_text(text)
          PY

      - name: Remove temporary codemod workflow
        run: git rm .github/workflows/tmp-004-warning-round2-codemod.yml

      - name: Commit deterministic remediation
        run: |
          set -euo pipefail
          git config user.name 'moventra-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .
          git diff --cached --check
          git commit -m '004: remove residual runtime warnings'
          git push origin HEAD:phase/004-warning-cleanup-round2
