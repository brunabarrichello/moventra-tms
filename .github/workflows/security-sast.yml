name: Moventra SAST Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read
  security-events: write
  packages: read

concurrency:
  group: security-sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: always

      - name: Enforce high/critical SAST policy
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = process.env.SARIF_DIR;
          if (!root || !fs.existsSync(root)) {
            console.error('::error::CodeQL SARIF output is missing; SAST gate fails closed');
            process.exit(1);
          }

          const files = fs.readdirSync(root, { recursive: true })
            .filter((name) => String(name).endsWith('.sarif'))
            .map((name) => path.join(root, String(name)));
          if (files.length === 0) {
            console.error('::error::No SARIF files produced; SAST gate fails closed');
            process.exit(1);
          }

          let blocking = 0;
          let total = 0;
          for (const file of files) {
            const sarif = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const run of sarif.runs ?? []) {
              const rules = new Map();
              for (const rule of run.tool?.driver?.rules ?? []) rules.set(rule.id, rule);
              for (const extension of run.tool?.extensions ?? []) {
                for (const rule of extension.rules ?? []) rules.set(rule.id, rule);
              }
              for (const result of run.results ?? []) {
                total += 1;
                const rule = rules.get(result.ruleId);
                const securitySeverity = Number(rule?.properties?.['security-severity'] ?? 0);
                const isBlocking = securitySeverity >= 7 || result.level === 'error';
                if (isBlocking) {
                  blocking += 1;
                  console.error(`::error::Blocking SAST finding ${result.ruleId ?? 'unknown'} severity=${securitySeverity || result.level}`);
                }
              }
            }
          }

          const summary = [
            '## SAST gate',
            '',
            `- Findings analyzed: ${total}`,
            `- High/critical blocking findings: ${blocking}`,
            '',
            '**Policy:** CodeQL security severity >= 7.0 (high/critical), or SARIF level error, blocks the workflow.',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);

          if (blocking > 0) process.exit(1);
          NODE
