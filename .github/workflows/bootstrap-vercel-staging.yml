name: Bootstrap Vercel Staging

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-vercel-staging.yml
      - scripts/release/ensure-vercel-project.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_PROJECT_NAME: moventra-tms-staging
  VERCEL_NODE_VERSION: 22.x

jobs:
  bootstrap:
    name: Provision staging project
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
    steps:
      - name: Checkout project automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate administrative credentials
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN is required'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo '::error::VERCEL_ORG_ID is required'; exit 1; }

      - name: Converge staging project policy
        id: project
        run: |
          set -euo pipefail
          result="$(bash scripts/release/ensure-vercel-project.sh)"
          printf '%s\n' "$result"
          while IFS='=' read -r key value; do
            case "$key" in
              project_id|project_name|node_version) printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done <<< "$result"

      - name: Record bootstrap evidence
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          PROJECT_NODE_VERSION: ${{ steps.project.outputs.node_version }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/vercel-staging-bootstrap.txt <<EOF
          product=Moventra TMS
          environment=staging
          vercel_project_name=${VERCEL_PROJECT_NAME}
          vercel_project_id=${PROJECT_ID}
          node_version=${PROJECT_NODE_VERSION}
          directory_listing=false
          preview_deployments_disabled=true
          fluid_compute=true
          git_integration=disabled
          provisioned_by=github-actions
          trigger=${GITHUB_EVENT_NAME}
          workflow_run_id=${GITHUB_RUN_ID}
          result=success
          EOF

      - name: Upload bootstrap evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-staging-bootstrap
          path: evidence/vercel-staging-bootstrap.txt
          if-no-files-found: error
          retention-days: 90
